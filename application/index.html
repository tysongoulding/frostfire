<!doctype html>
<html lang="en" data-theme="frostfire" data-mode="dark" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frostfire OS</title>
    <!-- Google Fonts Import (Ubuntu & Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --font-main: 'Ubuntu', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --bg: #121212;
        --surface: #1E1E1E;
        --text-primary: #F5F5F5;
        --text-muted: #A3A3A3;
        --accent-primary: #38BDF8;
        --accent-secondary: #FF3366;
        --border: #2E2E2E;
      }
      html, body {
        background-color: var(--bg, #121212);
        color: var(--text-primary, #F5F5F5);
        font-family: var(--font-main);
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body class="bg-theme-bg text-theme-text-primary antialiased h-screen overflow-hidden selection:bg-theme-accent-primary selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
