[package]
name = "frostfire-gateway"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "frostfire-gateway"
path = "src/main.rs"

[dependencies]
frostfire-proto = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["tls"] }
prost = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
frostfire-orchestrator = { workspace = true }

[dev-dependencies]
frostfire-tunnel = { workspace = true }
frostfire-daemon = { workspace = true }
frostfire-exec = { workspace = true }
frostfire-security = { workspace = true }
