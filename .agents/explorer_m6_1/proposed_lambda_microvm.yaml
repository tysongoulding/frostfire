AWSTemplateFormatVersion: '2010-09-09'
Description: 'Frostfire Cloud: Production AWS Lambda Containerized Agent MicroVM per User with Firecracker Isolation, EFS Workspace Persistence & Response Streaming'

Parameters:
  EnvironmentName:
    Type: String
    Default: frostfire-lambda
    Description: Environment naming prefix for resources

  LambdaMemorySize:
    Type: Number
    Default: 10240
    MinValue: 512
    MaxValue: 10240
    Description: Memory in MB for Lambda microVM (10240 MB allocates 6 dedicated vCPUs within the Firecracker execution environment)

  EphemeralStorageSize:
    Type: Number
    Default: 10240
    MinValue: 512
    MaxValue: 10240
    Description: Ephemeral /tmp storage in MB for agent builds, git clones, and artifacts

  TimeoutSeconds:
    Type: Number
    Default: 900
    MinValue: 30
    MaxValue: 900
    Description: Maximum function invocation timeout in seconds (900s = 15 minutes)

  ContainerImageUri:
    Type: String
    Default: ""
    Description: URI of the container image in ECR (if left blank, defaults to the created ECR repository root)

  GatewayEndpoint:
    Type: String
    Default: "https://gateway.frostfire.internal:50051"
    Description: Outbound reverse-tunnel gateway endpoint for persistent stream multiplexing

  VpcCIDR:
    Type: String
    Default: 10.50.0.0/16
    Description: CIDR block for the Lambda and EFS VPC

  PrivateSubnet1CIDR:
    Type: String
    Default: 10.50.1.0/24
    Description: CIDR block for Private Subnet 1 (AZ 1)

  PrivateSubnet2CIDR:
    Type: String
    Default: 10.50.2.0/24
    Description: CIDR block for Private Subnet 2 (AZ 2)

Conditions:
  HasCustomImage: !Not [!Equals [!Ref ContainerImageUri, ""]]

Resources:
  # ============================================================================
  # 1. VPC & Networking Infrastructure
  # ============================================================================
  LambdaVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCIDR
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-igw'

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref LambdaVpc
      InternetGatewayId: !Ref InternetGateway

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LambdaVpc
      CidrBlock: !Ref PrivateSubnet1CIDR
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LambdaVpc
      CidrBlock: !Ref PrivateSubnet2CIDR
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-2'

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref LambdaVpc
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-private-routes'

  Subnet1RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable

  Subnet2RouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable

  # ============================================================================
  # 2. Security Groups
  # ============================================================================
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Frostfire Lambda MicroVM
      VpcId: !Ref LambdaVpc
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound traffic from Lambda
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-lambda-sg'

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for EFS Mount Targets
      VpcId: !Ref LambdaVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 2049
          ToPort: 2049
          SourceSecurityGroupId: !Ref LambdaSecurityGroup
          Description: Allow inbound NFS traffic from Lambda MicroVM
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-efs-sg'

  # ============================================================================
  # 3. Amazon EFS File System, Mount Targets & Access Point
  # ============================================================================
  WorkspaceFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: elastic
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
      FileSystemTags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-workspace-efs'

  EfsMountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      SubnetId: !Ref PrivateSubnet1
      SecurityGroups:
        - !Ref EfsSecurityGroup

  EfsMountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      SubnetId: !Ref PrivateSubnet2
      SecurityGroups:
        - !Ref EfsSecurityGroup

  WorkspaceAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref WorkspaceFileSystem
      PosixUser:
        Uid: '10001'
        Gid: '10001'
      RootDirectory:
        Path: /workspace
        CreationInfo:
          OwnerUid: '10001'
          OwnerGid: '10001'
          Permissions: '0755'
      AccessPointTags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-workspace-ap'

  # ============================================================================
  # 4. Container Registry (ECR)
  # ============================================================================
  AgentEcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${EnvironmentName}-agent-microvm'
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain last 10 production images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-ecr'

  # ============================================================================
  # 5. IAM Execution Role
  # ============================================================================
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${EnvironmentName}-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: MicroVmAgentPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${EnvironmentName}/*'
        - PolicyName: EfsClientAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - elasticfilesystem:ClientMount
                  - elasticfilesystem:ClientWrite
                  - elasticfilesystem:ClientRootAccess
                Resource: !GetAtt WorkspaceFileSystem.Arn
                Condition:
                  StringEquals:
                    elasticfilesystem:AccessPointArn: !GetAtt WorkspaceAccessPoint.Arn

  # ============================================================================
  # 6. CloudWatch Structured Logging
  # ============================================================================
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${EnvironmentName}-agent'
      RetentionInDays: 30

  # ============================================================================
  # 7. AWS Lambda Function (Firecracker MicroVM per User with EFS Mount)
  # ============================================================================
  AgentMicroVmFunction:
    Type: AWS::Lambda::Function
    DependsOn:
      - LogGroup
      - LambdaExecutionRole
      - EfsMountTarget1
      - EfsMountTarget2
    Properties:
      FunctionName: !Sub '${EnvironmentName}-agent'
      Description: 'Per-user Frostfire agent runner in dedicated Firecracker microVM with response streaming and persistent EFS workspace'
      PackageType: Image
      Code:
        ImageUri: !If
          - HasCustomImage
          - !Ref ContainerImageUri
          - !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}-agent-microvm:latest'
      MemorySize: !Ref LambdaMemorySize
      EphemeralStorage:
        Size: !Ref EphemeralStorageSize
      Timeout: !Ref TimeoutSeconds
      Role: !GetAtt LambdaExecutionRole.Arn
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      FileSystemConfigs:
        - Arn: !GetAtt WorkspaceAccessPoint.Arn
          LocalMountPath: /mnt/workspace
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          AWS_LWA_READ_TIMEOUT_MS: "900000"
          PORT: "8080"
          FROSTFIRE_GATEWAY_URL: !Ref GatewayEndpoint
          FROSTFIRE_SAND_MODE: "lambda-microvm"
          RUST_LOG: "info,frostfire_agent=debug"
          WORKSPACE_DIR: "/mnt/workspace"
          FROSTFIRE_PERSIST_ROOT: "/mnt/workspace"
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-function'
        - Key: Architecture
          Value: FirecrackerMicroVM

  # ============================================================================
  # 8. Lambda Function URL with Response Streaming
  # ============================================================================
  AgentFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      AuthType: NONE
      TargetFunctionArn: !GetAtt AgentMicroVmFunction.Arn
      InvokeMode: RESPONSE_STREAM
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - authorization
          - x-sand-window-owner
          - x-sand-display
          - x-agent-id
          - content-type
        MaxAge: 3600

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AgentMicroVmFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

Outputs:
  VpcId:
    Description: ID of the dedicated Frostfire VPC
    Value: !Ref LambdaVpc
    Export:
      Name: !Sub '${EnvironmentName}-VpcId'

  WorkspaceFileSystemId:
    Description: ID of the persistent EFS FileSystem
    Value: !Ref WorkspaceFileSystem
    Export:
      Name: !Sub '${EnvironmentName}-FileSystemId'

  WorkspaceFileSystemArn:
    Description: ARN of the persistent EFS FileSystem
    Value: !GetAtt WorkspaceFileSystem.Arn
    Export:
      Name: !Sub '${EnvironmentName}-FileSystemArn'

  WorkspaceAccessPointArn:
    Description: ARN of the EFS Access Point mounted at /mnt/workspace
    Value: !GetAtt WorkspaceAccessPoint.Arn
    Export:
      Name: !Sub '${EnvironmentName}-AccessPointArn'

  EcrRepositoryUri:
    Description: ECR Repository URI for building and pushing the Lambda Agent MicroVM container image
    Value: !GetAtt AgentEcrRepository.RepositoryUri
    Export:
      Name: !Sub '${EnvironmentName}-EcrRepoUri'

  FunctionArn:
    Description: Lambda Agent MicroVM Function ARN
    Value: !GetAtt AgentMicroVmFunction.Arn
    Export:
      Name: !Sub '${EnvironmentName}-FunctionArn'

  FunctionUrl:
    Description: Streaming HTTPS Function URL for direct client connectivity
    Value: !GetAtt AgentFunctionUrl.FunctionUrl
    Export:
      Name: !Sub '${EnvironmentName}-FunctionUrl'
