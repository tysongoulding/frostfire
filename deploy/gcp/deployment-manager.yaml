# Google Cloud Deployment Manager (GCP equivalent to AWS CloudFormation)
# Deploy with: gcloud deployment-manager deployments create frostfire-cloud --config deployment-manager.yaml

resources:
- name: frostfire-network
  type: compute.v1.network
  properties:
    autoCreateSubnetworks: true

- name: frostfire-firewall-grpc
  type: compute.v1.firewall
  properties:
    network: $(ref.frostfire-network.selfLink)
    sourceRanges: ["0.0.0.0/0"]
    allowed:
    - IPProtocol: tcp
      ports: ["50051"]
    targetTags: ["frostfire-gateway"]

- name: frostfire-gateway-vm
  type: compute.v1.instance
  properties:
    zone: us-central1-a
    machineType: zones/us-central1-a/machineTypes/e2-medium
    tags:
      items: ["frostfire-gateway"]
    disks:
    - deviceName: boot
      type: PERSISTENT
      boot: true
      autoDelete: true
      initializeParams:
        sourceImage: projects/cos-cloud/global/images/family/cos-stable
    networkInterfaces:
    - network: $(ref.frostfire-network.selfLink)
      accessConfigs:
      - name: External NAT
        type: ONE_TO_ONE_NAT
    metadata:
      items:
      - key: gce-container-declaration
        value: |
          spec:
            containers:
              - name: frostfire-gateway
                image: ghcr.io/tysongoulding/frostfire-cloud:latest
                command: ["frostfire-gateway", "--bind", "0.0.0.0:50051"]
                stdin: false
                tty: false
            restartPolicy: Always
